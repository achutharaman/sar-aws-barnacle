[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sar-aws-barnacle"
version = "0.1.0"
description = "Read-only AWS cost-waste and hygiene scanner. Lints your account, never touches it."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "S A R" }]
keywords = ["aws", "cost", "finops", "cloud", "audit", "cli", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.34",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[ec2,iam,rds]>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/achutharaman/sar-aws-barnacle"
Issues = "https://github.com/achutharaman/sar-aws-barnacle/issues"
Changelog = "https://github.com/achutharaman/sar-aws-barnacle/blob/main/CHANGELOG.md"

# One console script. The sar-aws-* prefix is a portfolio-wide naming
# convention, so the command name matches the PyPI distribution exactly.
[project.scripts]
sar-aws-barnacle = "sar_aws_barnacle.cli:app"

# Extension seam: third-party packages can ship checks by advertising this
# entry-point group. Nothing in this repo needs to change for them to load.
[project.entry-points."sar_aws_barnacle.checks"]

[tool.hatch.build.targets.wheel]
packages = ["src/sar_aws_barnacle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:sar_aws_barnacle.*"]

[tool.coverage.run]
source = ["sar_aws_barnacle"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = ["A003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
